name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-syntax:
    name: Python syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile all Python files
        run: |
          set -e
          for f in scripts/*.py skill/scripts/*.py; do
            [ -f "$f" ] || continue
            echo "→ $f"
            python3 -m py_compile "$f"
          done

  frontend:
    name: Frontend build is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm --prefix web ci
      - name: Typecheck
        run: npm --prefix web run typecheck
      - name: Unit tests
        run: npm --prefix web run test
      # throughline/web/ is committed so `pip install throughline` never needs
      # Node. The cost of committing build output is that a source-only commit
      # silently ships the previous UI — so rebuild and fail if the result
      # differs from what is checked in.
      - name: Rebuild
        run: npm --prefix web run build
      - name: Fail if the committed build is stale
        run: |
          if ! git diff --quiet -- throughline/web; then
            echo "::error::throughline/web/ is out of date with web/src/."
            echo "Run: npm --prefix web run build && git add throughline/web"
            git diff --stat -- throughline/web
            exit 1
          fi
          echo "Committed frontend matches source."

  python-imports:
    name: Verify required packages are declarable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install requirements
        run: pip install -r requirements.txt

  unit-tests:
    name: Unit tests (no DB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Run pytest (unit only)
        run: pytest tests/ -v --tb=short -m "not integration" --ignore=tests/integration

  integration-tests:
    name: Integration tests (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGADMINDB: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            pg_isready -h localhost -U postgres && exit 0
            sleep 1
          done
          echo "Postgres did not become ready" >&2
          exit 1
      - name: Run integration tests
        run: pytest tests/integration/ -v --tb=short -m integration

  shell-syntax:
    name: Bash syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n on every shell script
        run: |
          set -e
          for f in scripts/*.sh; do
            [ -f "$f" ] || continue
            echo "→ $f"
            bash -n "$f"
          done

  sql-syntax:
    name: SQL syntax check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply schema
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -c "CREATE DATABASE claude_memory;"
          psql -h localhost -U postgres -d claude_memory -f sql/schema.sql

  eval-smoke:
    name: Eval harness + status (no DB, no API)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install -e .
      - name: throughline status --json (DB-unreachable, must still parse)
        env:
          PGHOST: 127.0.0.1
          PGPORT: "1"
          PGUSER: nobody
          PGCONNECT_TIMEOUT: "1"
        run: |
          set -e
          python3 -m throughline status --json --pretty | tee /tmp/status.json
          python3 -c "import json,sys; d=json.load(open('/tmp/status.json'));\
            assert d['db_reachable'] is False, d;\
            assert 'table_row_counts' in d;\
            assert 'chunks_by_category' in d;\
            print('status payload shape OK')"
      - name: evals --dry-run (parses 30 questions, no DB, no LLM)
        run: python3 evals/run_eval.py --dry-run
      - name: evals --offline-stub (deterministic, no DB, no LLM)
        run: |
          python3 evals/run_eval.py --offline-stub --report /tmp/eval_smoke.md
          test -s /tmp/eval_smoke.md
          grep -q "with-memory recall" /tmp/eval_smoke.md

  markdown-lint:
    name: Markdown links and formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: "**/*.md"
          config: |
            {
              "default": true,
              "MD013": false,
              "MD024": { "siblings_only": true },
              "MD033": false,
              "MD041": false
            }
        continue-on-error: true
