<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600"
     role="img"
     aria-label="Throughline architecture — six local AI tools feed one Postgres+pgvector memory store, which is read by Streamlit GUI, MCP server, and a Claude Code skill.">
  <title>Throughline architecture</title>
  <desc>Dark architecture diagram with three columns: six AI CLIs on the left, Throughline core in the middle, and three consumer surfaces on the right. Arrows indicate JSONL/SQLite/JSON ingest flow into the core, then context streaming back out to the consumers.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#0A0E14"/>
    </linearGradient>

    <linearGradient id="thread-in" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#58A6FF"/>
      <stop offset="100%" stop-color="#79C0FF"/>
    </linearGradient>

    <linearGradient id="thread-out" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#7EE787"/>
      <stop offset="100%" stop-color="#A6E5C2"/>
    </linearGradient>

    <radialGradient id="core" cx="50%" cy="50%" r="60%">
      <stop offset="0%"  stop-color="#1F2630"/>
      <stop offset="100%" stop-color="#161B22"/>
    </radialGradient>

    <pattern id="grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#1F2630"/>
    </pattern>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- arrowhead pointing right (ingest), accent blue -->
    <marker id="arrow-in" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#58A6FF"/>
    </marker>

    <!-- arrowhead pointing right (consumer fan-out), success green -->
    <marker id="arrow-out" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7EE787"/>
    </marker>
  </defs>

  <!-- background -->
  <rect width="1200" height="600" fill="url(#bg)"/>
  <rect width="1200" height="600" fill="url(#grid)" opacity="0.5"/>

  <!-- top label -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
     fill="#8B949E" font-size="13" letter-spacing="3">
    <text x="64" y="48">ARCHITECTURE · CROSS-TOOL MEMORY LAYER · LOCAL-FIRST</text>
  </g>

  <!-- ── Column headers ─────────────────────────────────────────────────── -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
     font-size="13" font-weight="600" fill="#C9D1D9" letter-spacing="0.5">
    <text x="160" y="95" text-anchor="middle">SOURCES · local AI tools</text>
    <text x="600" y="95" text-anchor="middle">THROUGHLINE · your laptop</text>
    <text x="1040" y="95" text-anchor="middle">CONSUMERS · read APIs</text>
  </g>

  <!-- ── Source cards (left column) ─────────────────────────────────────── -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif">
    <!-- Claude Code -->
    <g transform="translate(60 120)">
      <rect width="200" height="48" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1"/>
      <circle cx="22" cy="24" r="6" fill="#58A6FF"/>
      <text x="42" y="22" font-size="14" font-weight="600" fill="#C9D1D9">Claude Code</text>
      <text x="42" y="38" font-size="11" fill="#8B949E" font-family="ui-monospace, monospace">~/.claude/projects/*.jsonl</text>
    </g>
    <!-- Codex -->
    <g transform="translate(60 180)">
      <rect width="200" height="48" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1"/>
      <circle cx="22" cy="24" r="6" fill="#58A6FF"/>
      <text x="42" y="22" font-size="14" font-weight="600" fill="#C9D1D9">OpenAI Codex CLI</text>
      <text x="42" y="38" font-size="11" fill="#8B949E" font-family="ui-monospace, monospace">~/.codex/sessions/*.jsonl</text>
    </g>
    <!-- Hermes -->
    <g transform="translate(60 240)">
      <rect width="200" height="48" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1"/>
      <circle cx="22" cy="24" r="6" fill="#58A6FF"/>
      <text x="42" y="22" font-size="14" font-weight="600" fill="#C9D1D9">Hermes Agent</text>
      <text x="42" y="38" font-size="11" fill="#8B949E" font-family="ui-monospace, monospace">~/.hermes/state.db + sessions/</text>
    </g>
    <!-- Continue -->
    <g transform="translate(60 300)">
      <rect width="200" height="48" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1"/>
      <circle cx="22" cy="24" r="6" fill="#58A6FF"/>
      <text x="42" y="22" font-size="14" font-weight="600" fill="#C9D1D9">Continue.dev</text>
      <text x="42" y="38" font-size="11" fill="#8B949E" font-family="ui-monospace, monospace">~/.continue/sessions/*.json</text>
    </g>
    <!-- Windsurf -->
    <g transform="translate(60 360)">
      <rect width="200" height="48" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1"/>
      <circle cx="22" cy="24" r="6" fill="#58A6FF"/>
      <text x="42" y="22" font-size="14" font-weight="600" fill="#C9D1D9">Windsurf</text>
      <text x="42" y="38" font-size="11" fill="#8B949E" font-family="ui-monospace, monospace">~/.windsurf/plans/*.md</text>
    </g>
    <!-- Cline -->
    <g transform="translate(60 420)">
      <rect width="200" height="48" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1"/>
      <circle cx="22" cy="24" r="6" fill="#58A6FF"/>
      <text x="42" y="22" font-size="14" font-weight="600" fill="#C9D1D9">Cline</text>
      <text x="42" y="38" font-size="11" fill="#8B949E" font-family="ui-monospace, monospace">VS Code · per-task dirs</text>
    </g>
  </g>

  <!-- ── Ingest arrows (left → core) ────────────────────────────────────── -->
  <g stroke="url(#thread-in)" stroke-width="2.5" fill="none" opacity="0.85" filter="url(#soft-glow)">
    <path d="M 270 144 C 360 144, 380 250, 460 254" marker-end="url(#arrow-in)"/>
    <path d="M 270 204 C 360 204, 380 270, 460 274" marker-end="url(#arrow-in)"/>
    <path d="M 270 264 C 360 264, 380 290, 460 294" marker-end="url(#arrow-in)"/>
    <path d="M 270 324 C 360 324, 380 310, 460 314" marker-end="url(#arrow-in)"/>
    <path d="M 270 384 C 360 384, 380 330, 460 334" marker-end="url(#arrow-in)"/>
    <path d="M 270 444 C 360 444, 380 350, 460 354" marker-end="url(#arrow-in)"/>
  </g>

  <!-- ── Core (Throughline) ─────────────────────────────────────────────── -->
  <g transform="translate(470 130)">
    <rect width="270" height="340" rx="14" fill="url(#core)" stroke="#30363D" stroke-width="1.5"/>

    <!-- core header strip -->
    <rect width="270" height="50" rx="14" fill="#1F2630"/>
    <rect y="36" width="270" height="14" fill="#1F2630"/>
    <text x="135" y="32" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
          font-size="16" font-weight="700" fill="#C9D1D9" letter-spacing="-0.3">
      Throughline core
    </text>

    <!-- adapters block -->
    <g transform="translate(20 70)">
      <rect width="230" height="58" rx="8" fill="#161B22" stroke="#30363D"/>
      <text x="15" y="22" font-size="12" font-weight="600" fill="#C9D1D9"
            font-family="-apple-system, BlinkMacSystemFont, system-ui, sans-serif">Adapters</text>
      <text x="15" y="42" font-size="11" fill="#8B949E"
            font-family="ui-monospace, monospace">one module / source · uuid5 dedup</text>
    </g>

    <!-- Postgres + pgvector block -->
    <g transform="translate(20 140)">
      <rect width="230" height="78" rx="8" fill="#161B22" stroke="#30363D"/>
      <circle cx="20" cy="22" r="5" fill="#58A6FF"/>
      <text x="36" y="26" font-size="13" font-weight="600" fill="#C9D1D9"
            font-family="-apple-system, BlinkMacSystemFont, system-ui, sans-serif">Postgres + pgvector</text>
      <text x="15" y="48" font-size="11" fill="#8B949E"
            font-family="ui-monospace, monospace">conversations · messages</text>
      <text x="15" y="62" font-size="11" fill="#8B949E"
            font-family="ui-monospace, monospace">memory_chunks · embeddings · entities</text>
    </g>

    <!-- Pipelines block -->
    <g transform="translate(20 230)">
      <rect width="230" height="92" rx="8" fill="#161B22" stroke="#30363D"/>
      <text x="15" y="22" font-size="12" font-weight="600" fill="#C9D1D9"
            font-family="-apple-system, BlinkMacSystemFont, system-ui, sans-serif">Pipelines</text>
      <text x="15" y="40" font-size="11" fill="#8B949E"
            font-family="ui-monospace, monospace">extract · embed · reflect</text>
      <text x="15" y="56" font-size="11" fill="#8B949E"
            font-family="ui-monospace, monospace">supersede · forget · audit (drift)</text>
      <text x="15" y="72" font-size="11" fill="#7EE787"
            font-family="ui-monospace, monospace">PII redaction default-on</text>
    </g>
  </g>

  <!-- ── Fan-out arrows (core → consumers) ──────────────────────────────── -->
  <g stroke="url(#thread-out)" stroke-width="2.5" fill="none" opacity="0.9" filter="url(#soft-glow)">
    <path d="M 740 200 C 820 200, 850 175, 920 175" marker-end="url(#arrow-out)"/>
    <path d="M 740 280 C 820 280, 850 280, 920 280" marker-end="url(#arrow-out)"/>
    <path d="M 740 380 C 820 380, 850 385, 920 385" marker-end="url(#arrow-out)"/>
  </g>

  <!-- ── Consumer cards (right column) ──────────────────────────────────── -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif">
    <!-- Streamlit GUI -->
    <g transform="translate(925 150)">
      <rect width="215" height="56" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1"/>
      <circle cx="22" cy="28" r="6" fill="#7EE787"/>
      <text x="42" y="25" font-size="14" font-weight="600" fill="#C9D1D9">Streamlit GUI</text>
      <text x="42" y="42" font-size="11" fill="#8B949E" font-family="ui-monospace, monospace">14 pages · live demo</text>
    </g>
    <!-- MCP server -->
    <g transform="translate(925 250)">
      <rect width="215" height="56" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1"/>
      <circle cx="22" cy="28" r="6" fill="#7EE787"/>
      <text x="42" y="25" font-size="14" font-weight="600" fill="#C9D1D9">MCP server</text>
      <text x="42" y="42" font-size="11" fill="#8B949E" font-family="ui-monospace, monospace">8 stdio tools for any MCP client</text>
    </g>
    <!-- Claude Code skill -->
    <g transform="translate(925 360)">
      <rect width="215" height="56" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1"/>
      <circle cx="22" cy="28" r="6" fill="#7EE787"/>
      <text x="42" y="25" font-size="14" font-weight="600" fill="#C9D1D9">Claude Code skill</text>
      <text x="42" y="42" font-size="11" fill="#8B949E" font-family="ui-monospace, monospace">SessionStart context injection</text>
    </g>
  </g>

  <!-- ── Footer strip ───────────────────────────────────────────────────── -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
     font-size="13" fill="#6E7681">
    <text x="64"   y="555">No telemetry · No cloud round-trip · MIT licensed</text>
    <text x="1136" y="555" text-anchor="end">github.com/mkupermann/throughline</text>
  </g>

  <!-- accent bar -->
  <rect x="64" y="575" width="1072" height="2" fill="#21262D"/>
  <rect x="64" y="575" width="220"  height="2" fill="#58A6FF"/>
  <rect x="284" y="575" width="80"  height="2" fill="#7EE787"/>
</svg>
