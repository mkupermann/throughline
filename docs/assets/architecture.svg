<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#f8f9fa" />
  
  <!-- Title -->
  <text x="400" y="30" font-family="Arial" font-size="20" text-anchor="middle" fill="#333">Throughline Adapter Architecture</text>
  
  <!-- Adapter Boxes Row 1 -->
  <rect x="50" y="100" width="150" height="60" rx="5" ry="5" fill="#e3f2fd" stroke="#2196f3" stroke-width="2" />
  <text x="125" y="135" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Claude Code</text>
  
  <rect x="220" y="100" width="150" height="60" rx="5" ry="5" fill="#e8f5e9" stroke="#4caf50" stroke-width="2" />
  <text x="295" y="135" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Hermes</text>

  <rect x="390" y="100" width="150" height="60" rx="5" ry="5" fill="#fff3e0" stroke="#ff9800" stroke-width="2" />
  <text x="465" y="135" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Vibe</text>

  <!-- Adapter Boxes Row 2 -->
  <rect x="135" y="180" width="150" height="60" rx="5" ry="5" fill="#fce4ec" stroke="#e91e63" stroke-width="2" />
  <text x="210" y="215" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Codex</text>

  <rect x="315" y="180" width="150" height="60" rx="5" ry="5" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2" />
  <text x="390" y="215" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Continue</text>

  <rect x="495" y="180" width="150" height="60" rx="5" ry="5" fill="#fce4ec" stroke="#e91e63" stroke-width="2" />
  <text x="570" y="215" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Cline</text>

  <!-- Normalised Conversations Box -->
  <rect x="250" y="280" width="200" height="60" rx="5" ry="5" fill="#e0f7fa" stroke="#00bcd4" stroke-width="2" />
  <text x="350" y="315" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Normalised</text>
  <text x="350" y="335" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Conversations</text>

  <!-- PostgreSQL Box -->
  <rect x="300" y="360" width="200" height="40" rx="5" ry="5" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2" />
  <text x="400" y="385" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">PostgreSQL + pgvector</text>

  <!-- Arrows from adapters to normalised conversations -->
  <path d="M200 160 L250 280" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M370 160 L350 280" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M540 160 L450 280" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M285 240 L250 280" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M440 240 L350 280" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M645 240 L450 280" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

  <!-- Arrow from normalised to PostgreSQL -->
  <path d="M350 340 L350 360" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

  <!-- Arrowhead definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>
  
  <!-- Adapter label -->
  <text x="400" y="70" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">Adapters</text>
</svg>
