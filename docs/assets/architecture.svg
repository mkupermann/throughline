<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <!-- Hintergrund -->
  <rect width="100%" height="100%" fill="#f8f9fa" />
  
  <!-- Titel -->
  <text x="400" y="30" font-family="Arial" font-size="20" text-anchor="middle" fill="#333">Throughline Architektur mit Plugin-System</text>
  
  <!-- Boxen -->
  <rect x="50" y="100" width="150" height="60" rx="5" ry="5" fill="#e3f2fd" stroke="#2196f3" stroke-width="2" />
  <text x="125" y="135" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Streamlit UI</text>

  <rect x="250" y="100" width="150" height="60" rx="5" ry="5" fill="#e8f5e9" stroke="#4caf50" stroke-width="2" />
  <text x="325" y="135" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Plugin Manager</text>

  <rect x="450" y="50" width="150" height="60" rx="5" ry="5" fill="#fff3e0" stroke="#ff9800" stroke-width="2" />
  <text x="525" y="85" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Vibe CLI Plugin</text>

  <rect x="450" y="120" width="150" height="60" rx="5" ry="5" fill="#fff3e0" stroke="#ff9800" stroke-width="2" />
  <text x="525" y="155" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">HDC Plugin</text>

  <rect x="450" y="190" width="150" height="60" rx="5" ry="5" fill="#fff3e0" stroke="#ff9800" stroke-width="2" />
  <text x="525" y="225" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Custom Plugins</text>

  <rect x="650" y="100" width="150" height="150" rx="5" ry="5" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2" />
  <text x="725" y="135" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">PostgreSQL</text>
  <text x="725" y="155" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">+ pgvector</text>
  <text x="725" y="185" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Wissensgraph</text>

  <!-- Pfeile -->
  <path d="M200 130 L240 130" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  <path d="M400 130 L440 130" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  <path d="M400 130 L440 80" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  <path d="M400 130 L440 180" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  <path d="M400 130 L440 220" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  <path d="M600 85 L640 85" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  <path d="M600 155 L640 155" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  <path d="M600 225 L640 225" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  <path d="M325 240 L325 160" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  <path d="M750 130 L750 200" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />

  <!-- Pfeilspitze definieren -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>
  
  <!-- Legende -->
  <text x="400" y="350" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">Plugin-System für AI-CLIs (Vibe CLI, HDC, Custom)</text>
</svg>
