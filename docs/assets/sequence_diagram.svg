<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#f8f9fa" />
  
  <!-- Title -->
  <text x="400" y="30" font-family="Arial" font-size="20" text-anchor="middle" fill="#333">Vibe Session Ingestion Sequence</text>
  
  <!-- Lifelines -->
  <line x1="100" y1="60" x2="100" y2="380" stroke="#666" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="300" y1="60" x2="300" y2="380" stroke="#666" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="500" y1="60" x2="500" y2="380" stroke="#666" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="700" y1="60" x2="700" y2="380" stroke="#666" stroke-width="1" stroke-dasharray="5,5"/>
  
  <!-- Lifeline labels -->
  <text x="100" y="50" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">User</text>
  <text x="300" y="50" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">Vibe Adapter</text>
  <text x="500" y="50" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">Parser</text>
  <text x="700" y="50" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">PostgreSQL</text>

  <!-- Messages -->
  <path d="M100 80 L300 80" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="200" y="75" font-family="Arial" font-size="11" text-anchor="middle" fill="#333">run: throughline ingest --source vibe</text>

  <path d="M300 120 L300 140 L500 140" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="400" y="135" font-family="Arial" font-size="11" text-anchor="middle" fill="#333">discover()</text>

  <path d="M500 140 L500 160 L300 160" stroke="#666" stroke-width="2" fill="none" marker-start="url(#arrowhead)"/>
  <text x="400" y="155" font-family="Arial" font-size="11" text-anchor="middle" fill="#333">session directories</text>

  <path d="M300 180 L500 180" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="400" y="175" font-family="Arial" font-size="11" text-anchor="middle" fill="#333">parse(session_dir)</text>

  <path d="M500 180 L500 200 L300 200" stroke="#666" stroke-width="2" fill="none" marker-start="url(#arrowhead)"/>
  <text x="400" y="195" font-family="Arial" font-size="11" text-anchor="middle" fill="#333">NormalisedConversation</text>

  <path d="M300 220 L700 220" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="500" y="215" font-family="Arial" font-size="11" text-anchor="middle" fill="#333">write to DB</text>

  <path d="M700 220 L700 240 L300 240" stroke="#666" stroke-width="2" fill="none" marker-start="url(#arrowhead)"/>
  <text x="500" y="235" font-family="Arial" font-size="11" text-anchor="middle" fill="#333">ingest summary</text>

  <!-- Arrowhead definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>
</svg>
