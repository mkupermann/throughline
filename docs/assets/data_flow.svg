<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <!-- Hintergrund -->
  <rect width="100%" height="100%" fill="#f8f9fa" />
  
  <!-- Titel -->
  <text x="400" y="30" font-family="Arial" font-size="20" text-anchor="middle" fill="#333">Datenfluss in Throughline</text>
  
  <!-- Boxen -->
  <rect x="50" y="50" width="120" height="50" rx="5" ry="5" fill="#e3f2fd" stroke="#2196f3" stroke-width="2" />
  <text x="110" y="78" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">Benutzer</text>

  <rect x="200" y="50" width="120" height="50" rx="5" ry="5" fill="#e8f5e9" stroke="#4caf50" stroke-width="2" />
  <text x="260" y="78" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">Streamlit UI</text>

  <rect x="350" y="50" width="120" height="50" rx="5" ry="5" fill="#fff3e0" stroke="#ff9800" stroke-width="2" />
  <text x="410" y="78" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">Plugin Manager</text>

  <rect x="500" y="50" width="120" height="50" rx="5" ry="5" fill="#fff3e0" stroke="#ff9800" stroke-width="2" />
  <text x="560" y="78" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">Vibe CLI Plugin</text>

  <rect x="650" y="50" width="120" height="50" rx="5" ry="5" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2" />
  <text x="710" y="78" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">Vibe CLI</text>

  <rect x="500" y="120" width="120" height="50" rx="5" ry="5" fill="#fce4ec" stroke="#e91e63" stroke-width="2" />
  <text x="560" y="148" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">Verarbeitetes Ergebnis</text>

  <rect x="650" y="120" width="120" height="50" rx="5" ry="5" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2" />
  <text x="710" y="148" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">PostgreSQL + pgvector</text>

  <rect x="500" y="190" width="120" height="50" rx="5" ry="5" fill="#fce4ec" stroke="#e91e63" stroke-width="2" />
  <text x="560" y="218" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">Wissensgraph</text>

  <!-- Pfeile -->
  <path d="M170 75 L190 75" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  <path d="M290 75 L310 75" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  <path d="M430 75 L470 75" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  <path d="M590 75 L630 75" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  <path d="M730 75 L730 110" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  <path d="M730 175 L690 175" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  <path d="M590 148 L550 148" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  <path d="M630 175 L630 190" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  <path d="M590 218 L590 240" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  <path d="M560 240 L170 240 L170 80" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />

  <!-- Pfeilspitze definieren -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
