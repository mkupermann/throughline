<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#f8f9fa" />
  
  <!-- Title -->
  <text x="400" y="30" font-family="Arial" font-size="20" text-anchor="middle" fill="#333">Throughline Data Flow</text>
  
  <!-- User -->
  <rect x="50" y="50" width="120" height="50" rx="5" ry="5" fill="#e3f2fd" stroke="#2196f3" stroke-width="2" />
  <text x="110" y="78" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">User</text>

  <!-- Streamlit UI -->
  <rect x="200" y="50" width="120" height="50" rx="5" ry="5" fill="#e8f5e9" stroke="#4caf50" stroke-width="2" />
  <text x="260" y="78" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">Streamlit UI</text>

  <!-- Adapters -->
  <rect x="350" y="50" width="120" height="50" rx="5" ry="5" fill="#fff3e0" stroke="#ff9800" stroke-width="2" />
  <text x="410" y="78" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">Adapters</text>

  <!-- Vibe CLI -->
  <rect x="500" y="50" width="120" height="50" rx="5" ry="5" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2" />
  <text x="560" y="78" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">Vibe</text>

  <!-- Processed Results -->
  <rect x="350" y="120" width="120" height="50" rx="5" ry="5" fill="#fce4ec" stroke="#e91e63" stroke-width="2" />
  <text x="410" y="148" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">Processed</text>
  <text x="410" y="163" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">Data</text>

  <!-- PostgreSQL -->
  <rect x="500" y="120" width="120" height="50" rx="5" ry="5" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2" />
  <text x="560" y="148" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">PostgreSQL</text>
  <text x="560" y="163" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">+ pgvector</text>

  <!-- Knowledge Graph -->
  <rect x="350" y="200" width="120" height="50" rx="5" ry="5" fill="#fff3e0" stroke="#ff9800" stroke-width="2" />
  <text x="410" y="228" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">Knowledge</text>
  <text x="410" y="243" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">Graph</text>

  <!-- Memory Extraction -->
  <rect x="500" y="200" width="120" height="50" rx="5" ry="5" fill="#e3f2fd" stroke="#2196f3" stroke-width="2" />
  <text x="560" y="228" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">Memory</text>
  <text x="560" y="243" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">Extraction</text>

  <!-- Semantic Search -->
  <rect x="425" y="280" width="150" height="50" rx="5" ry="5" fill="#e8f5e9" stroke="#4caf50" stroke-width="2" />
  <text x="500" y="308" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">Semantic</text>
  <text x="500" y="323" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">Search</text>

  <!-- Arrows -->
  <path d="M170 75 L200 75" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M320 75 L350 75" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M470 75 L500 75" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M620 75 L650 75 L650 120 L620 120" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M410 175 L410 200" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M560 175 L560 200" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M470 250 L425 280" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M560 250 L425 280" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

  <!-- Arrowhead definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>
</svg>
