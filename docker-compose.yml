# Throughline — universal AI CLI memory layer
# PostgreSQL (pgvector) + web UI/API + optional MCP server / Ollama embeddings
# Supported sources: Claude Code, Cursor, Zed, Codex, Hermes, Continue, Cline, Windsurf, Vibe

# Source mounts: every adapter resolves its data directory relative to $HOME,
# which is /root inside the containers. Host tool directories are therefore
# mounted read-only at the same relative location under /root. A missing host
# directory is harmless — the adapter reports the source as "not present".

x-source-mounts: &source-mounts
  # Claude Code (Anthropic)
  - ~/.claude:/root/.claude:ro
  # Cursor (Anysphere)
  - ~/.cursor:/root/.cursor:ro
  # Zed (Zed Industries)
  - ~/.zed:/root/.zed:ro
  # Codex (OpenAI)
  - ~/.codex:/root/.codex:ro
  # Hermes (Community)
  - ~/.hermes:/root/.hermes:ro
  # Continue (Continue.dev)
  - ~/.continue:/root/.continue:ro
  # Windsurf (Codeium/Cognition)
  - ~/.windsurf:/root/.windsurf:ro
  # Vibe (Mistral AI)
  - ~/.vibe:/root/.vibe:ro
  # Cline (VS Code extension — macOS path; on Linux use ~/.config/Code/...)
  - ~/Library/Application Support/Code/User/globalStorage/saoudrizwan.claude-dev/tasks:/root/Library/Application Support/Code/User/globalStorage/saoudrizwan.claude-dev/tasks:ro

x-pg-env: &pg-env
  PGHOST: postgres
  PGPORT: 5432
  PGDATABASE: throughline
  PGUSER: throughline
  PGPASSWORD: throughline_dev_password

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL with pgvector (core database)
  # ---------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: throughline-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: throughline
      POSTGRES_USER: throughline
      POSTGRES_PASSWORD: throughline_dev_password
    ports:
      # Host port defaults to 5433 so a native PostgreSQL on 5432 is never
      # shadowed. Containers talk to postgres:5432 internally regardless.
      - "${THROUGHLINE_DB_PORT:-5433}:5432"
    volumes:
      # Persistent database storage — contains all memory data. Do not delete.
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U throughline -d throughline"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # Applies the packaged, versioned migrations to new and persistent volumes.
  # Application processes wait for this service to finish successfully.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *pg-env
    command: ["throughline", "migrate"]

  # ---------------------------------------------------------------------------
  # Throughline web UI + JSON API — http://127.0.0.1:8788
  #
  # Published on 8788 rather than 8787. 8787 is a popular default and is easily
  # held by another local service — a service-managed one (launchd, systemd) will
  # even reclaim it the instant a container releases it, so `up` fails with
  # "address already in use" on every attempt. The container still listens on
  # 8787 internally, which is why the healthcheck below is unchanged. Change only
  # the left-hand side of the mapping if 8788 is taken on your machine too.
  # ---------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: throughline-web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *pg-env
    ports:
      # Published on loopback only: the API has no authentication, so the
      # container must not be reachable from the rest of the network.
      - "127.0.0.1:8788:8787"
    volumes: *source-mounts
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8787/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ---------------------------------------------------------------------------
  # MCP server (optional, profile "mcp")
  # The server speaks MCP over stdio; AI CLI clients normally launch it
  # themselves. This service exists for containerized clients:
  #   docker compose run -i --rm mcp
  # ---------------------------------------------------------------------------
  mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: throughline-mcp
    stdin_open: true
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *pg-env
    volumes: *source-mounts
    command: ["python", "-m", "memory_mcp.server"]
    profiles:
      - mcp

  # ---------------------------------------------------------------------------
  # Ollama (optional, profile "embeddings") — local embedding generation
  # ---------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: throughline-ollama
    restart: unless-stopped
    profiles:
      - embeddings
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  # Database storage — this volume contains all ingested memory data.
  postgres_data:
    name: throughline_postgres_data
  ollama_data:
    name: throughline_ollama_data
