    <script>
      // Set the theme before first paint so a dark-mode user never sees a
      // white flash. Reads the same key the ThemeProvider writes; "system"
      // (or no value) leaves the attribute off and lets prefers-color-scheme
      // decide, which is what the token file expects.
      (function () {
        try {
          var t = localStorage.getItem("throughline-theme");
          if (t === "dark" || t === "light") {
            document.documentElement.setAttribute("data-theme", t);
          }
        } catch (e) {
          /* private mode: fall through to system */
        }
      })();
    </script>
